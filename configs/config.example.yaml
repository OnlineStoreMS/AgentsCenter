server:
  port: 8107
  mode: debug

database:
  driver: sqlite
  sqlite_path: ./data/agentscenter.db
  # postgres_dsn: "host=127.0.0.1 user=agentscenter password=agentscenter dbname=agentscenter port=5432 sslmode=disable TimeZone=Asia/Shanghai"

auth:
  enabled: true
  jwt_secret: "change-me-in-production-use-long-random-string"
  internal_token: "change-me-internal-token"

aftersales:
  base_url: "http://localhost:8093"
  internal_token: "change-me-internal-token"

jobs:
  retention_days: 3
  # claimed/running 超过该分钟未结束则自动标 failed（须大于 WA 整单超时，当前 WA≈45 分钟）
  stale_minutes: 60

cors:
  allow_origins:
    - "http://localhost:5192"
    - "http://127.0.0.1:5192"
    - "http://localhost:5174"
    - "http://127.0.0.1:5174"
